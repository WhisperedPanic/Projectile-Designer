<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projectile Tool</title>

<style>
body { font-family: Arial; background:#111; color:#eee; padding:20px; }
.container { display:flex; gap:20px; }
.panel { background:#1a1a1a; padding:15px; border-radius:8px; }
input, select { width:100%; margin-bottom:10px; padding:5px; }
svg { background:#000; border:1px solid #444; }

/* Unit toggle switch */
.unit-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 0.9em;
    color: #aaa;
}
.unit-toggle span.active { color: #eee; font-weight: bold; }
.switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #3a3a3a;
    border-radius: 24px;
    transition: background .25s;
}
.slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: #eee;
    border-radius: 50%;
    transition: transform .25s;
}
input:checked + .slider { background: #4a9eff; }
input:checked + .slider::before { transform: translateX(22px); }

/* Inline unit label next to field label */
.ulbl {
    color: #6af;
    font-size: 0.8em;
    margin-left: 4px;
}
</style>
</head>

<body>

<h2>Projectile Tool</h2>

<div class="container">

<div class="panel">
<h3>Inputs</h3>

<!-- Unit system toggle -->
<div class="unit-toggle">
  <span id="lbl_imperial" class="active">Imperial</span>
  <label class="switch">
    <input type="checkbox" id="unit_toggle">
    <span class="slider"></span>
  </label>
  <span id="lbl_metric">Metric</span>
</div>

<label for="caliber">Caliber <span class="ulbl">in</span></label>
<input id="caliber" type="number" step="0.001">
<label for="overall_length">Overall Length <span class="ulbl">in</span></label>
<input id="overall_length" type="number" step="0.001">
<label for="nose_length">Nose Length <span class="ulbl">in</span></label>
<input id="nose_length" type="number" step="0.001">
<label for="boat_tail_length">Boat Tail Length <span class="ulbl">in</span></label>
<input id="boat_tail_length" type="number" step="0.001">
<label for="boat_tail_angle">Boat Tail Angle (deg)</label>
<input id="boat_tail_angle" type="number" step="0.1">

<label for="ogive_type">Ogive Form</label>
<select id="ogive_type">
  <option value="tangent">Tangent</option>
  <option value="secant">Secant</option>
  <option value="hybrid">Hybrid</option>
</select>

<label for="joinPosition">

    Join Position (%)

    <span title="Join Position (% of nose length)

0–20%   → Secant-dominant (sharp, high performance, sensitive)

20–40%  → Performance hybrid (sleek, still secant-biased)

40–60%  → Balanced hybrid (recommended baseline)

60–80%  → Tangent-dominant (stable, more tolerant)

80–100% → Near tangent (robust, higher drag)

Lower % → curvature concentrated near tip

Higher % → curvature distributed along nose">

        ⓘ

    </span>

</label>   
<input id="joinPosition" type="number" step="1" min="0" max="100" value="50">
    
<label for="material_select">Material</label>
<select id="material_select"></select>

<h3>Stability Check (For Info Only)</h3>

<label for="twist_select">Twist Rate</label>
<select id="twist_select">
  <option value="7">1:7</option>
  <option value="8">1:8</option>
  <option value="9">1:9</option>
  <option value="10" selected>1:10</option>
  <option value="11">1:11</option>
  <option value="12">1:12</option>
</select>

<label for="sg_select">Target Stability (Sg)</label>
<select id="sg_select">
  <option value="1.5">1.5 - Minimum Requirement</option>
  <option value="1.8" selected>1.8 - Preferred</option>
  <option value="2.0">2.0 - Cold Environment</option>
</select>

<button id="updateBtn">Update</button>
</div>

<div class="panel">
<h3>Shape</h3>
<svg id="canvas" width="600" height="200"></svg>
<div id="sanity_output"></div>
</div>

<div class="panel">
<h3>Output</h3>
<pre id="output"></pre>
</div>

</div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
