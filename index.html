<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projectile Tool</title>

<style>
body { font-family: Arial; background:#111; color:#eee; padding:20px; }
.container { display:flex; gap:20px; }
.panel { background:#1a1a1a; padding:15px; border-radius:8px; }
input, select { width:100%; margin-bottom:10px; padding:5px; }
svg { background:#000; border:1px solid #444; }
</style>
</head>

<body>

<h2>Projectile Tool (Modular)</h2>

<div class="container">

<div class="panel">
<h3>Inputs</h3>

<input id="caliber" type="number" step="0.001">
<input id="overall_length" type="number" step="0.001">
<input id="nose_length" type="number" step="0.001">
<input id="boat_tail_length" type="number" step="0.001">
<input id="boat_tail_angle" type="number" step="0.1">

<select id="ogive_type">
  <option value="tangent">Tangent</option>
  <option value="secant">Secant</option>
  <option value="hybrid">Hybrid</option>
</select>

<button id="updateBtn">Update</button>
</div>

<div class="panel">
<h3>Shape</h3>
<svg id="canvas" width="600" height="200"></svg>
</div>

<div class="panel">
<h3>Output</h3>
<pre id="output"></pre>
</div>

</div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
