<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projectile Tool</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.panel {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 8px;
}

input, select {
    width: 100%;
    margin-bottom: 10px;
    padding: 5px;
}

svg {
    background: #000;
    border: 1px solid #444;
}
</style>
</head>

<body>

<h2>Projectile Geometry Tool</h2>

<div class="container">

<!-- INPUTS -->
<div class="panel">
    <h3>Inputs</h3>

    <label>Caliber</label>
    <input id="caliber" type="number" step="0.001" value="0.308">

    <label>Overall Length</label>
    <input id="overall_length" type="number" step="0.001" value="1.2">

    <label>Nose Length</label>
    <input id="nose_length" type="number" step="0.001" value="0.45">

    <label>Boat Tail Length</label>
    <input id="boat_tail_length" type="number" step="0.001" value="0.18">

    <label>Boat Tail Angle</label>
    <input id="boat_tail_angle" type="number" step="0.1" value="9.0">

    <label>Ogive Type</label>
    <select id="ogive_type">
        <option value="tangent">Tangent</option>
        <option value="secant">Secant</option>
        <option value="hybrid">Hybrid</option>
    </select>

    <button onclick="update()">Update</button>
</div>

<!-- VISUAL -->
<div class="panel">
    <h3>Shape</h3>
    <svg id="canvas" width="600" height="200"></svg>
</div>

<!-- OUTPUT -->
<div class="panel">
    <h3>Output (JSON)</h3>
    <pre id="output"></pre>
</div>

</div>

<script>
// ------------------------------------------------------------------
// ENUM
// ------------------------------------------------------------------

const OgiveType = {
    TANGENT: "tangent",
    SECANT: "secant",
    HYBRID: "hybrid"
};

// ------------------------------------------------------------------
// OGIVE
// ------------------------------------------------------------------

function computeTangentOgiveRadius(noseLength, caliber) {
    const R = caliber / 2;
    return (noseLength * noseLength + R * R) / (2 * R);
}

function getOgiveRadius(params) {
    return computeTangentOgiveRadius(params.nose_length, params.caliber);
}

function computeOgiveY(x, R, rho) {
    const cx = Math.sqrt(Math.max(rho*rho - (rho - R)*(rho - R), 0));

    if (x <= 0) return 0;

    const disc = rho*rho - (x - cx)*(x - cx);
    if (disc < 0) return 0;

    return Math.max(Math.sqrt(disc) - (rho - R), 0);
}

// ------------------------------------------------------------------
// GEOMETRY
// ------------------------------------------------------------------

function computeNoseProfile(params, segments = 120) {
    const R = params.caliber / 2;
    const rho = getOgiveRadius(params);
    const L = params.nose_length;

    const pts = [];

    for (let i = 0; i <= segments; i++) {
        const x = (i / segments) * L;
        const y = computeOgiveY(x, R, rho);
        pts.push({x, y});
    }

    if (Math.abs(pts[pts.length-1].y - R) > 1e-6) {
        pts.push({x: L, y: R});
    }

    return pts;
}

function computeProjectileOutline(params) {
    const R = params.caliber / 2;

    const raw_btr = R - params.boat_tail_length * Math.tan(params.boat_tail_angle * Math.PI/180);
    const boat_tail_r = Math.max(raw_btr, 0.005);

    const body_length = Math.max(
        params.overall_length - params.nose_length - params.boat_tail_length,
        0
    );

    const nose = computeNoseProfile(params);
    const upper = [...nose];

    if (body_length > 0) {
        upper.push({x: params.nose_length + body_length, y: R});
    }

    const BT_SEGS = 30;

    for (let i = 1; i <= BT_SEGS; i++) {
        const t = i / BT_SEGS;
        upper.push({
            x: params.nose_length + body_length + t * params.boat_tail_length,
            y: R + t * (boat_tail_r - R)
        });
    }

    upper.push({x: params.overall_length, y: 0});

    const lower = upper.slice(0, -1)
        .reverse()
        .map(p => ({x: p.x, y: -p.y}));

    return [...upper, ...lower];
}

// ------------------------------------------------------------------
// VOLUME
// ------------------------------------------------------------------

function computeVolume(params) {
    const R = params.caliber / 2;

    const raw_btr = R - params.boat_tail_length * Math.tan(params.boat_tail_angle * Math.PI/180);
    const boat_tail_r = Math.max(raw_btr, 0.005);

    const body_length = Math.max(
        params.overall_length - params.nose_length - params.boat_tail_length,
        0
    );

    const rho = getOgiveRadius(params);

    const N = 1000;
    const dx = params.overall_length / N;

    let total = 0;

    for (let i = 0; i <= N; i++) {
        const x = i * dx;

        let r;

        if (x <= params.nose_length) {
            r = computeOgiveY(x, R, rho);
        } else if (x <= params.nose_length + body_length) {
            r = R;
        } else {
            const t = (x - params.nose_length - body_length) / params.boat_tail_length;
            r = R + t * (boat_tail_r - R);
        }

        const w = (i === 0 || i === N) ? 0.5 : 1;
        total += w * r * r;
    }

    return Math.PI * total * dx;
}

// ------------------------------------------------------------------
// BALLISTICS
// ------------------------------------------------------------------

function computeBallistics(params) {
    const D = params.caliber;

    const volume_in3 = computeVolume(params);
    const volume_cc = volume_in3 * 16.3871;

    const density = 10.8;

    const mass_g = volume_cc * density;
    const mass_gr = mass_g * 15.4324;
    const mass_lb = mass_gr / 7000;

    const sd = mass_lb / (D * D);

    const LR = params.nose_length / D;
    const BTA = params.boat_tail_angle;
    const BTL = params.boat_tail_length / D;

    const base = {
        tangent: 1.03,
        secant: 0.96,
        hybrid: 0.99
    };

    let i7 =
        base[params.ogive_type]
        -0.015*(LR - 3.0)
        -0.006*(BTA - 7.0)
        -0.005*(BTL - 0.5)/0.1;

    i7 = Math.max(0.70, Math.min(1.40, i7));

    const bc_g7 = sd / i7;
    const bc_g1 = bc_g7 / 0.47;

    return { volume_in3, mass_gr, sd, bc_g7, bc_g1 };
}

// ------------------------------------------------------------------
// MAIN
// ------------------------------------------------------------------

function analyze(params) {
    return {
        geometry: params,
        ballistics: computeBallistics(params),
        points: {
            outline: computeProjectileOutline(params),
            nose: computeNoseProfile(params)
        }
    };
}

// ------------------------------------------------------------------
// RENDER
// ------------------------------------------------------------------

function draw(points) {
    const svg = document.getElementById("canvas");
    svg.innerHTML = "";

    const scale = 400;
    const offsetX = 50;
    const offsetY = 100;

    const path = points.map((p, i) =>
        (i === 0 ? "M" : "L") +
        (p.x * scale + offsetX) + "," +
        (-p.y * scale + offsetY)
    ).join(" ");

    const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", path);
    el.setAttribute("stroke", "lime");
    el.setAttribute("fill", "none");

    svg.appendChild(el);
}

// ------------------------------------------------------------------
// UI
// ------------------------------------------------------------------

function getParams() {
    return {
        caliber: parseFloat(caliber.value),
        overall_length: parseFloat(overall_length.value),
        nose_length: parseFloat(nose_length.value),
        boat_tail_length: parseFloat(boat_tail_length.value),
        boat_tail_angle: parseFloat(boat_tail_angle.value),
        ogive_type: ogive_type.value
    };
}

function update() {
    const params = getParams();
    const result = analyze(params);

    draw(result.points.outline);

    output.textContent = JSON.stringify(result, null, 2);
}

// initial render
update();

</script>

</body>
</html>
